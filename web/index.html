<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Herdr Observatory</title><link rel="preload" href="/fonts/JetBrainsMonoNerdFont-Regular.ttf" as="font" type="font/ttf" crossorigin><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body><canvas id="pixel-field" aria-hidden="true"></canvas><main id="observatory">
<header><div class="brand"><button id="brand-title" aria-label="Rich. Play title effect" title="Play title effect"><canvas id="title-mark" aria-hidden="true"></canvas><span id="title-fallback">Rich</span></button></div><div id="music-widget" role="group" aria-label="Music" hidden><span id="music-accessible" class="sr-only"></span><div class="music-track"><span id="music-title"></span><canvas id="music-effect" hidden aria-hidden="true"></canvas></div><div class="music-track music-artist-track"><span id="music-artist"></span><canvas id="artist-effect" hidden aria-hidden="true"></canvas></div></div><div class="summary"><div class="totals"><span class="total idle"><strong id="idle-count">0</strong><span>Idle</span></span><span class="total working"><strong id="working-count">0</strong><span>Working</span></span><span class="total blocked"><strong id="blocked-count">0</strong><span>Blocked</span></span><span class="total done"><strong id="done-count">0</strong><span>Done</span></span></div></div></header>
<section id="fleet" aria-label="Machine activity"></section>
<section class="thread-section" aria-label="Agent threads"><div class="section-heading"><h1>Threads <span id="thread-total">0 total</span></h1><span id="connection-status"><span id="connection-loader" class="blocks-loader" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span id="connection">Connecting</span></span><nav aria-label="Thread navigation"><button id="previous" title="Page Up">← Previous</button><span id="page">0 / 0</span><button id="next" title="Page Down">Next →</button><button id="rotate" title="Automatically advances every 15 seconds. R enables auto-paging." aria-pressed="true">Auto-page threads: on</button><button id="category" hidden>Category: all</button></nav></div><div id="threads"></div><p id="empty">Waiting for permitted threads</p></section>
<footer id="activity"><section class="observations-panel" aria-label="Recent observations"><div class="section-heading"><h2>Recent observations</h2><nav id="controls" aria-label="Display controls"><button id="fullscreen" title="F">Fullscreen</button></nav></div><div id="events"></div><canvas id="event-effect" hidden aria-hidden="true"></canvas></section><section id="allowances" aria-label="Codex allowances"><div id="allowance-panels"></div></section></footer>
</main><pre id="transcript" class="sr-only" aria-label="Current fleet and sampled observations"></pre></body></html>
