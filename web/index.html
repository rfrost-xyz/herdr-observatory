<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Herdr Observatory</title><link rel="preload" href="/fonts/JetBrainsMonoNerdFont-Regular.ttf" as="font" type="font/ttf" crossorigin><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body><main id="observatory">
<header><div class="brand"><span class="mark" aria-hidden="true">▦</span><div>herdr observatory<small id="profile">Connecting</small></div></div><div class="activity-widget"><div id="equaliser" aria-hidden="true"></div><div>Observed activity<small id="activity-state">Quiet</small></div></div><div class="summary"><strong id="working-count">0 working</strong><span id="blocked-count">0 blocked</span><small id="theme">Theme unavailable</small></div></header>
<section id="fleet" aria-label="Machine activity"></section>
<section class="thread-section" aria-label="Agent threads"><div class="section-heading"><h1>Threads <span id="thread-total">0 total</span></h1><span id="connection">Connecting</span><nav aria-label="Thread navigation"><button id="previous" title="Page Up">← Previous</button><span id="page">0 / 0</span><button id="next" title="Page Down">Next →</button><button id="rotate" title="R enables rotation">Rotation: on</button><button id="category" hidden>Category: all</button></nav></div><div id="threads"></div><p id="empty">Waiting for permitted threads</p></section>
<footer id="activity"><div class="section-heading"><h2>Recent observations</h2><span id="sampling">Read only</span><nav id="controls" aria-label="Display controls"><button id="less-effects" aria-label="Decrease effects cooldown">−</button><span id="cooldown">120s effects</span><button id="more-effects" aria-label="Increase effects cooldown">+</button><button id="pause" aria-pressed="false" title="Space">Pause motion</button><button id="fullscreen" title="F">Fullscreen</button></nav></div><div id="events"></div><canvas id="event-effect" hidden aria-hidden="true"></canvas></footer>
</main><pre id="transcript" class="sr-only" aria-label="Current fleet and sampled observations"></pre></body></html>
