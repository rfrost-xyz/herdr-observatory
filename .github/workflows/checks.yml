name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: rustup toolchain install 1.96.0 --profile minimal
      - run: cargo +1.96.0 build --release --locked --manifest-path renderer/Cargo.toml
      - run: OBSERVATORY_TEXT_RENDERER="$PWD/renderer/target/release/observatory-text" python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: node --test tests/test_ui.cjs
